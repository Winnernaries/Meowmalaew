<!DOCTYPE html>
<html lang="th">
<head>
<meta property="og:image" content="https://via.placeholder.com/1">
<meta property="og:image:width" content="0">
<meta property="og:image:height" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meowmalaew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    min-height: 100vh;
    font-family: "Sarabun", "Noto Sans Thai", sans-serif;
    overflow: hidden;
    background: #faf7f2;
    transition: background .6s;
  }
  body.flower-mode { background: #ffffff; }
 
  .page {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .hidden { display: none !important; }
 
  /* =====================================================
     หน้า 1 : เต้าหู้ (มินิมอล)
     ===================================================== */
  #page-tofu::before {              /* กรอบเส้นบางๆ รอบหน้า */
    content: "";
    position: absolute;
    inset: 22px;
    border: 1px solid #e8dfcf;
    border-radius: 28px;
    pointer-events: none;
  }
 
  .dot {                            /* จุดเล็กๆ ประดับ */
    position: absolute;
    border-radius: 50%;
    background: #e6dac4;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  .dot.d1 { width: 8px;  height: 8px;  top: 18%; left: 20%; }
  .dot.d2 { width: 5px;  height: 5px;  top: 28%; right: 22%; animation-delay: .8s; }
  .dot.d3 { width: 10px; height: 10px; bottom: 24%; left: 26%; animation-delay: 1.6s; }
  .dot.d4 { width: 6px;  height: 6px;  bottom: 30%; right: 18%; animation-delay: 2.2s; }
  .dot.d5 { width: 4px;  height: 4px;  top: 14%; right: 38%; animation-delay: 1.2s; }
 
  .stage {
    position: relative;
    width: min(340px, 90vw);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shadow {                         /* เงาใต้เต้าหู้ */
    position: absolute;
    bottom: 22px;
    width: 170px;
    height: 14px;
    border-radius: 50%;
    background: rgba(120, 95, 55, .15);
    filter: blur(4px);
    animation: shadow 2.8s ease-in-out infinite;
  }
 
  /* ช่องใส่รูปเต้าหู้ (GIF) */
  .tofu-wrap {
    position: relative;
    z-index: 2;
    width: 200px;
    height: 200px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s;
    animation: float 2.8s ease-in-out infinite;
  }
  .tofu-wrap:hover { transform: scale(1.07); }
  .tofu-wrap.clicked { animation: squish .5s forwards; }
  .tofu-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
 
  .tofu-svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 6px 8px rgba(120, 95, 55, .12));
  }
  .tofu-svg .eye {                  /* กะพริบตา */
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.5s infinite;
  }
  .tofu-svg .spark {                /* ประกายระยิบ */
    transform-box: fill-box;
    transform-origin: center;
    animation: sparkle 2.4s ease-in-out infinite;
  }
  .tofu-svg .spark.s2 { animation-delay: 1.1s; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    96%           { transform: scaleY(.1); }
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(.5) rotate(0);   opacity: .5; }
    50%      { transform: scale(1.1) rotate(25deg); opacity: 1; }
  }
 
  /* เต้าหู้สำรอง (ใช้เมื่อเปลี่ยนไปใช้รูป GIF แล้วรูปโหลดไม่ขึ้น) */
  .tofu-placeholder {
    display: none;
    width: 140px;
    height: 140px;
    background: linear-gradient(145deg, #fffdf6, #f3ead0);
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,.1), inset 0 -6px 0 rgba(0,0,0,.04);
    position: relative;
  }
  .tofu-placeholder::before, .tofu-placeholder::after {
    content: "";
    position: absolute;
    top: 54px;
    width: 10px; height: 10px;
    background: #4a4036;
    border-radius: 50%;
  }
  .tofu-placeholder::before { left: 40px; }
  .tofu-placeholder::after  { right: 40px; }
 
  /* ===== กรอบรูปหน้าแรก (ขนาดปรับตามรูปที่ใส่) ===== */
  .pic-frame {
    position: relative;
    z-index: 2;
    display: inline-block;
    line-height: 0;
    padding: 11px;
    border-radius: 38px;
    background: conic-gradient(from var(--a), #ffc9a0, #fff2a8, #c6f2b0, #a8e6ff, #e3c4ff, #ffc4dd, #ffc9a0);
    box-shadow: 0 14px 30px rgba(150, 110, 60, .22), 0 0 0 5px #fff;
    animation: borderspin 7s linear infinite, float 3s ease-in-out infinite;
    transition: rotate .3s, scale .3s;
  }
  .pic-frame:hover { rotate: -2deg; scale: 1.03; }
  .pic-frame img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(300px, 70vw);
    max-height: 42vh;
    border-radius: 28px;
    box-shadow: 0 0 0 4px #fff;
  }

  /* ===== หัวใจสีขาว ===== */
  .heart {
    position: relative;
    z-index: 2;
    width: min(300px, 74vw);
    height: auto;
    display: block;
    cursor: default;
    transform-origin: 50% 62%;
    filter: drop-shadow(0 10px 16px rgba(190, 150, 110, .28));
    animation: heartbeat 1.8s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.08); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.05); }
    70%      { transform: scale(1); }
  }

  /* ===== กรอบรูปแมว (ไม่ได้ใช้แล้ว) ===== */
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes borderspin { to { --a: 360deg; } }

  .cat-frame {
    position: relative;
    z-index: 2;
    width: min(250px, 64vw);
    aspect-ratio: 1;
    padding: 11px;
    border-radius: 38px;
    background: conic-gradient(from var(--a), #ffc9a0, #fff2a8, #c6f2b0, #a8e6ff, #e3c4ff, #ffc4dd, #ffc9a0);
    box-shadow: 0 14px 30px rgba(150, 110, 60, .22), 0 0 0 5px #fff;
    animation: borderspin 7s linear infinite, float 3s ease-in-out infinite;
    transition: transform .3s;
  }
  .cat-frame:hover { rotate: -3deg; scale: 1.04; }

  .cat-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 28px;
    overflow: hidden;
    background: #fff7ec;
    box-shadow: inset 0 0 0 4px #fff;
  }
  .cat-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cat-inner::after {               /* แสงสะท้อนวิ่งผ่านรูป */
    content: "";
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-18deg);
    animation: shine 5s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 60%  { left: -80%; }
    100%     { left: 140%; }
  }
  .cat-fallback {                   /* แสดงเมื่อรูปแมวโหลดไม่ขึ้น */
    display: none;
    width: 100%; height: 100%;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
  }

  /* หูแมว */
  .ear {
    position: absolute;
    top: -30px;
    width: 62px;
    height: 58px;
    background: #f4c28f;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    z-index: -1;
  }
  .ear::after {
    content: "";
    position: absolute;
    left: 50%; top: 24px;
    width: 28px; height: 28px;
    background: #ffb3c4;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    transform: translateX(-50%);
  }
  .ear.l { left: 20px;  transform: rotate(-14deg); transform-origin: bottom center; animation: wiggle 4s ease-in-out infinite; }
  .ear.r { right: 20px; transform: rotate(14deg);  transform-origin: bottom center; animation: wiggle 4s ease-in-out infinite .4s reverse; }
  @keyframes wiggle {
    0%, 85%, 100% { translate: 0 0; }
    90%           { translate: 0 -4px; }
    95%           { translate: 0 1px; }
  }

  /* ตกแต่งรอบกรอบ */
  .paw {
    position: absolute;
    z-index: 1;
    font-size: 1.4rem;
    opacity: .55;
    pointer-events: none;
    animation: bob 3.4s ease-in-out infinite;
  }
  .paw.p1 { top: 16%;    left: 16%; }
  .paw.p2 { top: 22%;    right: 15%; animation-delay: .7s; }
  .paw.p3 { bottom: 24%; left: 14%;  animation-delay: 1.4s; }
  .paw.p4 { bottom: 20%; right: 17%; animation-delay: 2.1s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50%      { transform: translateY(-10px) rotate(8deg); }
  }

  /* ปุ่มหน้าต่อไป (สีเขียว) */
  .next-btn {
    position: relative;
    z-index: 3;
    margin-top: 22px;
    padding: 14px 38px;
    font-family: "Mali", "Sarabun", sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: #fff;
    background: linear-gradient(180deg, #74d86f, #3fb34b);
    border: none;
    border-radius: 999px;
    box-shadow: 0 6px 0 #2e8a39, 0 14px 24px rgba(63, 179, 75, .32);
    cursor: pointer;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .next-btn::before {               /* แสงวิ่งผ่านปุ่ม */
    content: "";
    position: absolute;
    top: 0; left: -70%;
    width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out infinite;
  }
  .next-btn .arrow { display: inline-block; margin-left: 6px; animation: arrow 1.2s ease-in-out infinite; }
  .next-btn:hover  { transform: translateY(-3px); box-shadow: 0 9px 0 #2e8a39, 0 18px 28px rgba(63, 179, 75, .38); }
  .next-btn:active { transform: translateY(5px);  box-shadow: 0 1px 0 #2e8a39, 0 4px 10px rgba(63, 179, 75, .3); }
  @keyframes pulse { 0%, 100% { scale: 1; } 50% { scale: 1.04; } }
  @keyframes arrow { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }

  #page-tofu.leaving { animation: pageOut .5s forwards; }
  @keyframes pageOut { to { opacity: 0; transform: scale(.96); } }

  .text {
    margin-top: 26px;
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: .35em;
    padding-left: .35em;
    color: #7d6e58;
    text-align: center;
  }
  .hint {                           /* ลูกศรเล็กๆ ชี้ขึ้น */
    margin-top: 10px;
    width: 1px;
    height: 26px;
    background: linear-gradient(#cdbfa6, transparent);
    position: relative;
    animation: nudge 1.8s ease-in-out infinite;
  }
  .hint::before {
    content: "";
    position: absolute;
    top: -1px;
    left: -3px;
    width: 7px;
    height: 7px;
    border-left: 1px solid #b9a98d;
    border-top: 1px solid #b9a98d;
    transform: rotate(45deg);
  }
 
  @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes shadow  { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.8); opacity: .6; } }
  @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes nudge   { 0%,100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-6px); opacity: 1; } }
  @keyframes squish  {
    0%   { transform: scale(1, 1); }
    40%  { transform: scale(1.3, .6); }
    100% { transform: scale(0, 0); opacity: 0; }
  }
 
  /* =====================================================
     หน้า 2 : ดอกไม้ (น่ารักๆ)
     ===================================================== */
  #page-flower {
    animation: fadeIn .9s;
    background:
      radial-gradient(circle, rgba(120,120,150,.07) 2px, transparent 2.5px) 0 0 / 34px 34px,
      linear-gradient(180deg, #ffffff, #f6f7fb);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
 
  /* ดอกไม้ประดับมุมจอ */
  .corner {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    animation: spin 40s linear infinite;
  }
  .corner svg { width: 100%; height: 100%; display: block; }
  .corner.c1 { width: 190px; height: 190px; top: -70px;  left: -70px; }
  .corner.c2 { width: 150px; height: 150px; top: -50px;  right: -50px; animation-direction: reverse; }
  .corner.c3 { width: 160px; height: 160px; bottom: -60px; left: -50px; animation-direction: reverse; }
  .corner.c4 { width: 200px; height: 200px; bottom: -80px; right: -70px; }
  .corner.s1 { width: 54px; height: 54px; top: 17%;    left: 10%;  animation-duration: 18s; }
  .corner.s2 { width: 40px; height: 40px; top: 22%;    right: 11%; animation-duration: 22s; }
  .corner.s3 { width: 46px; height: 46px; bottom: 18%; left: 12%;  animation-duration: 26s; }
  .corner.s4 { width: 34px; height: 34px; bottom: 24%; right: 9%;  animation-duration: 20s; }
 
  /* ตัวหนังสือ/อีโมจิลอยๆ */
  .float-deco {
    position: absolute;
    z-index: 1;
    font-size: 1.6rem;
    pointer-events: none;
    animation: bob 3.2s ease-in-out infinite;
  }
  .float-deco.f1 { top: 12%;    left: 30%; }
  .float-deco.f2 { top: 14%;    right: 28%; animation-delay: .6s; }
  .float-deco.f3 { bottom: 12%; left: 32%;  animation-delay: 1.2s; }
  .float-deco.f4 { bottom: 14%; right: 30%; animation-delay: 1.8s; }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-6deg); }
    50%     { transform: translateY(-12px) rotate(6deg); }
  }
 
  /* กรอบรูปแบบโพลารอยด์ ช่องใส่รูปดอกไม้ */
  .flower-box {
    position: relative;
    z-index: 3;
    background: #ffffff;
    padding: 14px 14px 18px;
    border-radius: 22px;
    box-shadow: 0 14px 34px rgba(60, 60, 100, .14), 0 0 0 1px #ececf3;
    transform: rotate(-2deg);
    text-align: center;
    animation: sway-frame 5s ease-in-out infinite;
  }
  .flower-box::before,
  .flower-box::after {              /* เทปกาวติดมุม */
    content: "";
    position: absolute;
    top: -14px;
    width: 74px;
    height: 26px;
    background: rgba(255, 190, 200, .75);
    border-radius: 4px;
    box-shadow: 0 2px 4px rgba(0,0,0,.08);
  }
  .flower-box::before { left: -20px;  transform: rotate(-35deg); }
  .flower-box::after  { right: -20px; transform: rotate(35deg); background: rgba(190, 225, 255, .8); }
  @keyframes sway-frame {
    0%,100% { transform: rotate(-2deg); }
    50%     { transform: rotate(2deg); }
  }
 
  .flower-box img {
    max-width: min(440px, 76vw);
    max-height: 56vh;
    object-fit: contain;
    border-radius: 14px;
    display: block;
  }
  .flower-placeholder {
    display: none;
    width: min(340px, 70vw);
    height: 260px;
    border: 3px dashed #f0b400;
    border-radius: 14px;
    align-items: center;
    justify-content: center;
    color: #b58600;
    font-family: "Mali", cursive;
    font-size: 1.2rem;
    background: #fff9dd;
  }
  .sunflower {
    width: min(340px, 72vw);
    height: auto;
    max-height: 56vh;
    display: block;
    margin: 0 auto;
    background: #fff9dd;
    border-radius: 14px;
  }
  #petals {                         /* กลีบหมุนช้าๆ */
    transform-origin: 200px 170px;
    animation: spin 70s linear infinite;
  }
  .caption {
    margin-top: 14px;
    font-family: "Mali", cursive;
    font-weight: 600;
    font-size: 1.35rem;
    color: #7b7b8c;
  }
 
  /* แมวอิโมจิประดับหน้าสอง */
  .cat-deco {
    position: absolute;
    z-index: 1;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .08));
    animation: bob 3.4s ease-in-out infinite;
  }
  .petal { line-height: 1; }

  /* แมวอิโมจิที่ตกลงมา */
  .petal {
    position: fixed;
    top: -60px;
    z-index: 2;
    pointer-events: none;
    animation-name: fall, sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: 1, infinite;
    animation-fill-mode: forwards, none;
  }
  .petal svg { width: 100%; height: 100%; display: block; }
  @keyframes fall { to { top: 110vh; } }
  @keyframes sway {
    0%,100% { transform: translateX(-25px) rotate(-20deg); }
    50%     { transform: translateX(25px)  rotate(20deg); }
  }
</style>
</head>
<body>
 
  <!-- แม่แบบดอกไม้เหลือง (ใช้ซ้ำทั้งหน้า) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flower" viewBox="0 0 100 100">
      <g fill="#FFD21F" stroke="#E6A800" stroke-width="2">
        <ellipse cx="50" cy="24" rx="15" ry="22"/>
        <ellipse cx="50" cy="24" rx="15" ry="22" transform="rotate(72 50 50)"/>
        <ellipse cx="50" cy="24" rx="15" ry="22" transform="rotate(144 50 50)"/>
        <ellipse cx="50" cy="24" rx="15" ry="22" transform="rotate(216 50 50)"/>
        <ellipse cx="50" cy="24" rx="15" ry="22" transform="rotate(288 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="11" fill="#FF9F1C"/>
      <circle cx="46" cy="47" r="2.5" fill="#fff" opacity=".7"/>
    </symbol>
  </svg>
 
  <!-- ========== หน้า 1 : เต้าหู้ ========== -->
  <div class="page" id="page-tofu">
    <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <span class="dot d4"></span><span class="dot d5"></span>
 
    <div class="stage">
      <div class="shadow"></div>
      <!-- 🖼️ ช่องใส่ภาพหน้าแรก (วางไฟล์ pic1.jpg ไว้โฟลเดอร์เดียวกับ index.html หรือแก้ชื่อไฟล์ตรง src) -->
      <div class="pic-frame">
        <img src="meoww.jpg" alt="ภาพ">
      </div>
    </div>
 
    <button class="next-btn" id="next" type="button">จิ้ม <span class="arrow">→</span></button>

    <span class="paw p1">🤍</span><span class="paw p2">🤍</span>
    <span class="paw p3">🤍</span><span class="paw p4">🤍</span>
  </div>
 
  <!-- ========== หน้า 2 : ดอกไม้ ========== -->
  <div class="page hidden" id="page-flower">
    <!-- 🐱 แมวอิโมจิประดับรอบหน้า (เพิ่ม/ลบ/ย้ายได้ตามใจ) -->
    <span class="cat-deco" style="top:5%;left:4%;font-size:3.4rem;animation-delay:0s">🐱</span>
    <span class="cat-deco" style="top:4%;left:22%;font-size:2.2rem;animation-delay:.5s">😺</span>
    <span class="cat-deco" style="top:6%;left:44%;font-size:1.8rem;animation-delay:1s">🐾</span>
    <span class="cat-deco" style="top:3%;right:24%;font-size:2.4rem;animation-delay:.3s">😸</span>
    <span class="cat-deco" style="top:7%;right:5%;font-size:3.2rem;animation-delay:.8s">🐈</span>
    <span class="cat-deco" style="top:30%;left:6%;font-size:2.6rem;animation-delay:1.2s">😻</span>
    <span class="cat-deco" style="top:34%;right:7%;font-size:2.4rem;animation-delay:1.6s">🐈‍⬛</span>
    <span class="cat-deco" style="top:52%;left:3%;font-size:2rem;animation-delay:.4s">🐾</span>
    <span class="cat-deco" style="top:55%;right:4%;font-size:3rem;animation-delay:2s">😽</span>
    <span class="cat-deco" style="bottom:30%;left:8%;font-size:3rem;animation-delay:.9s">🐱</span>
    <span class="cat-deco" style="bottom:28%;right:9%;font-size:2.2rem;animation-delay:1.4s">😺</span>
    <span class="cat-deco" style="bottom:5%;left:5%;font-size:3.6rem;animation-delay:.2s">🐈</span>
    <span class="cat-deco" style="bottom:4%;left:26%;font-size:2.2rem;animation-delay:1.1s">🐾</span>
    <span class="cat-deco" style="bottom:6%;left:46%;font-size:2.6rem;animation-delay:.6s">😸</span>
    <span class="cat-deco" style="bottom:4%;right:24%;font-size:2rem;animation-delay:1.8s">🐾</span>
    <span class="cat-deco" style="bottom:6%;right:5%;font-size:3.4rem;animation-delay:.1s">😻</span>
 
    <div class="flower-box">
      <!-- 🖼️ ช่องใส่ภาพหน้าสอง (วางไฟล์ pic2.jpg ไว้โฟลเดอร์เดียวกับ index.html หรือแก้ชื่อไฟล์ตรง src) -->
      <img src="meow fun.jpg" alt="ภาพ">
      <!-- 👇 แก้ข้อความใต้รูปได้ตรงนี้ -->
      <div class="caption">โดนเส้นคนไทย</div>
    </div>
  </div>
 
<!-- 🎵 เพลงประกอบ (วางไฟล์ music.mp3 ไว้โฟลเดอร์เดียวกับ index.html หรือแก้ชื่อไฟล์ตรง src) -->
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
  const nextBtn = document.getElementById('next');
  const bgm = document.getElementById('bgm');
  const pageTofu = document.getElementById('page-tofu');
  const pageFlower = document.getElementById('page-flower');
 
  // กดปุ่มหน้าต่อไป -> สลับไปหน้าดอกไม้
  nextBtn.addEventListener('click', () => {
    pageTofu.classList.add('leaving');
    bgm.play().catch(() => {});   // เล่นเพลงตอนกดปุ่ม (ถ้าไม่มีไฟล์เพลงก็ข้ามไป ไม่ทำให้เว็บพัง)
    setTimeout(() => {
      pageTofu.classList.add('hidden');
      pageFlower.classList.remove('hidden');
      document.body.classList.add('flower-mode');
      document.title = 'ดอกไม้';
      startFlowers();
    }, 500);
  });
 
  // อิโมจิแมวที่จะตกลงมา (เพิ่ม/ลบได้)
  const cats = ['🐱', '😺', '😸', '😻', '😽', '🐈', '🐈‍⬛', '🐾'];

  function spawnFlower() {
    const el = document.createElement('div');
    el.className = 'petal';
    el.textContent = cats[Math.floor(Math.random() * cats.length)];
 
    const size = 22 + Math.random() * 26;       // ขนาด 22–48px
    const fallTime = 5 + Math.random() * 6;     // ตกใช้เวลา 5–11 วินาที
    const swayTime = 2 + Math.random() * 2;     // แกว่งซ้ายขวา
 
    el.style.fontSize = size + 'px';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.opacity = 0.75 + Math.random() * 0.25;
    el.style.animationDuration = fallTime + 's, ' + swayTime + 's';
 
    document.body.appendChild(el);
    setTimeout(() => el.remove(), fallTime * 1000);
  }
 
  function startFlowers() {
    for (let i = 0; i < 15; i++) setTimeout(spawnFlower, i * 150);
    setInterval(spawnFlower, 300);
  }
</script>
</body>
</html>
